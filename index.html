<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahi xD Advanced Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at top left,#29145b55,transparent 35%),radial-gradient(circle at top right,#0e749055,transparent 30%),#07111f;color:#fff;padding:18px}.app{max-width:850px;margin:auto}.hero{text-align:center;padding:20px}.logo{display:inline-block;padding:8px 15px;border:1px solid #22d3ee55;border-radius:99px;color:#67e8f9;font-weight:900}.hero h1{font-size:36px;margin:15px 0 6px}.hero p{color:#94a3b8}.panel{background:#111d31dd;border:1px solid #ffffff12;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 20px 55px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:900;color:#cbd5e1;margin:4px 0 7px}select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff1c;background:#071426;color:white;font-size:15px;margin-bottom:12px}.gen{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#4ade80,#22d3ee);font-weight:900;cursor:pointer}.topBtns,.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.topBtns button,.btns button{border:0;border-radius:10px;padding:11px;background:#263750;color:white;font-weight:800;cursor:pointer}.card{background:#071426;border:1px solid #ffffff12;border-radius:17px;padding:16px;margin-top:12px}.name{font-size:18px;font-weight:900;white-space:pre-line}.meta{font-family:monospace;color:#67e8f9;margin-top:8px;word-break:break-all}.pass{color:#c4b5fd}.cats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.cat{padding:9px 11px;border-radius:99px;background:#7c3aed28;border:1px solid #8b5cf655;color:#ddd6fe;font-size:12px;font-weight:800;cursor:pointer}.hint{font-size:11px;color:#94a3b8;margin-top:10px}.empty{text-align:center;color:#64748b;padding:30px}.credit{text-align:center;color:#94a3b8;padding:12px 0 30px}.credit b{color:#67e8f9}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:white;color:#07111f;padding:10px 16px;border-radius:99px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}@media(max-width:600px){body{padding:10px}.grid{grid-template-columns:1fr}.topBtns,.btns{grid-template-columns:1fr 1fr}.hero h1{font-size:29px}.panel{padding:15px}}
</style></head><body><div class="app">
<div class="hero"><div class="logo">⚡ Mahi xD</div><h1>Advanced Page Generator</h1><p>Name • Facebook Categories • Outlook</p></div>
<div class="panel"><div class="grid">
<div><label>COUNTRY</label><select id="country"><option value="bd">🇧🇩 Bangladeshi</option><option value="us">🇺🇸 US / American</option><option value="ca">🇨🇦 Canadian</option><option value="in">🇮🇳 Indian</option><option value="pk">🇵🇰 Pakistani</option></select></div>
<div><label>GENDER</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
<div><label>NAME FORMAT</label><select id="format"><option value="first">First Name</option><option value="full" selected>First + Last Name</option></select></div>
<div><label>QUANTITY</label><input id="qty" type="number" min="1" max="100" value="5"></div>
<div><label>PAGE SERIAL</label><select id="serial"><option value="1">Only Name</option><option value="3">1 - 3</option><option value="5" selected>1 - 5</option><option value="10">1 - 10</option></select></div>
<div><label>FACEBOOK CATEGORIES</label><select id="fb"><option value="yes" selected>Yes — Random 3</option><option value="no">No</option></select></div>
<div><label>OUTLOOK.FR</label><select id="outlook"><option value="no" selected>No</option><option value="yes">Yes</option></select></div>
<div><label>DEFAULT PASSWORD (OPTIONAL)</label><input id="password" type="text" placeholder="Blank = no password"></div>
</div><button class="gen" onclick="generate()">✨ GENERATE</button>
<div class="hint">Categories are selected automatically at random. There is no category-choice menu.</div></div>
<div class="panel"><div class="topBtns">
<button onclick="copyAllNames()">📋 All Names</button><button onclick="copyAllFirst()">First Names</button><button onclick="copyAllLast()">Last Names</button>
<button onclick="copyAllMail()">📧 All Mail</button><button onclick="copyAllCats()">🏷️ Categories</button><button onclick="clearResults()">🗑 Clear</button>
</div></div>
<div class="panel"><div id="count" class="hint">No data generated</div><div id="results"><div class="empty">Generate your first set ⚡</div></div></div>
<div class="credit">Designed & Created by <b>Mahi xD</b></div></div><div id="toast" class="toast">Copied ✓</div>
<script>
const DB={
bd:{male:["Tanvir","Sakib","Rakib","Nayeem","Fahim","Arif","Siam","Rafi","Mahin","Hasan","Shakib","Tamim","Nahid","Sabbir","Imran","Sajid","Farhan","Adnan","Shafin","Rifat","Arafat","Mehedi","Shuvo","Nabil","Foysal","Riad","Rayhan","Jubayer","Ashik","Sohan"],female:["Nusrat","Sumaiya","Sadia","Nafisa","Tasnim","Jannat","Tania","Raisa","Farzana","Mim","Sanjida","Nabila","Maliha","Samira","Faria","Rafia","Lamisa","Anika","Nadia","Rima","Tanjila","Sabiha","Afia","Ishrat","Mahi","Sharmin","Rumana","Nishi","Trisha","Oishi"],last:["Ahmed","Hasan","Hossain","Islam","Rahman","Khan","Chowdhury","Mahmud","Karim","Akter","Sarker","Miah","Talukder","Haque","Kabir","Alam","Uddin","Molla","Bhuiyan","Sheikh"]},
us:{male:["James","Michael","Robert","John","David","William","Daniel","Matthew","Joseph","Andrew","Christopher","Joshua","Ryan","Nicholas","Anthony","Jonathan","Justin","Brandon","Kevin","Jason","Austin","Tyler","Dylan","Ethan","Noah","Liam","Mason","Logan","Lucas","Benjamin"],female:["Emma","Olivia","Sophia","Emily","Ava","Mia","Grace","Chloe","Lily","Natalie","Isabella","Charlotte","Amelia","Harper","Evelyn","Abigail","Ella","Scarlett","Victoria","Aria","Samantha","Madison","Ashley","Hannah","Sarah","Jessica","Lauren","Rachel","Kayla","Nicole"],last:["Smith","Johnson","Williams","Brown","Jones","Miller","Davis","Wilson","Anderson","Taylor","Thomas","Moore","Jackson","Martin","Lee","Thompson","White","Harris","Clark","Lewis"]},
ca:{male:["Liam","Noah","Ethan","Lucas","Benjamin","Ryan","Nathan","Adam","Jacob","Logan","Owen","Jack","William","Thomas","Samuel","Daniel","Matthew","Alexander","Nicholas","Connor","Caleb","Dylan","Cameron","Cole","Evan","Luke","Mason","Aiden","James","Oliver"],female:["Emma","Charlotte","Olivia","Amelia","Sophie","Emily","Claire","Sarah","Hannah","Julia","Avery","Ella","Chloe","Grace","Isla","Maya","Natalie","Anna","Zoe","Leah","Madison","Hailey","Brooke","Lauren","Rachel","Victoria","Abigail","Lucy","Eva","Alice"],last:["Martin","Wilson","Brown","Thompson","Campbell","Anderson","Clark","Young","Scott","Walker","King","Wright","Hill","Green","Baker","Mitchell","Roberts","Carter","Phillips","Parker"]},
in:{male:["Aarav","Arjun","Rohan","Rahul","Vikram","Aditya","Karan","Ravi","Amit","Raj","Akash","Rohit","Vivek","Nikhil","Sanjay","Manish","Ankit","Varun","Deepak","Sahil","Aryan","Kabir","Dev","Ishaan","Krish","Arnav","Dhruv","Harsh","Abhishek","Kunal"],female:["Priya","Ananya","Neha","Pooja","Kavya","Riya","Isha","Diya","Meera","Sneha","Aditi","Anjali","Nisha","Simran","Kriti","Sakshi","Tanvi","Nandini","Radhika","Shreya","Aaradhya","Avni","Kiara","Myra","Tara","Ishita","Sanya","Palak","Divya","Aisha"],last:["Sharma","Patel","Singh","Kumar","Gupta","Verma","Mehta","Kapoor","Reddy","Joshi","Malhotra","Agarwal","Bhat","Desai","Nair","Rao","Shah","Chopra","Saxena","Yadav"]},
pk:{male:["Ali","Ahmed","Hamza","Usman","Bilal","Hassan","Fahad","Saad","Zain","Omar","Ahsan","Danish","Haris","Talha","Farhan","Salman","Imran","Asad","Shahzaib","Huzaifa","Abdullah","Ibrahim","Mustafa","Taha","Adeel","Waleed","Sameer","Umair","Noman","Rehan"],female:["Ayesha","Fatima","Hira","Sana","Maryam","Zara","Mahnoor","Iqra","Amna","Laiba","Areeba","Maham","Saba","Mehwish","Hania","Alina","Anum","Rida","Komal","Eman","Aleena","Zoya","Noor","Maira","Hafsa","Sidra","Nimra","Sehrish","Rabia","Kinza"],last:["Khan","Ahmed","Ali","Malik","Hussain","Sheikh","Qureshi","Siddiqui","Butt","Raza","Chaudhry","Abbasi","Mirza","Iqbal","Akhtar","Shah","Farooq","Javed","Mahmood","Rashid"]}};
const CATS=["Digital Creator","Video Creator","Blogger","Personal Blog","Entertainment Website","Community","Public Figure","Artist","Photographer","Gaming Video Creator","Education","Product/Service","Business Service","Entrepreneur","Website","Media/News Company","Shopping & Retail"];
let generated=[];
const KEY="MahiXD_OutlookHistory_V6";
const $=id=>document.getElementById(id), pick=a=>a[Math.floor(Math.random()*a.length)];
function threeCats(){let p=[...CATS],o=[];while(o.length<3){o.push(p.splice(Math.floor(Math.random()*p.length),1)[0])}return o}
function hist(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function randDigits(){let n=Math.floor(Math.random()*4)+2,s="";for(let i=0;i<n;i++)s+=i?Math.floor(Math.random()*10):Math.floor(Math.random()*9)+1;return s}
function mail(full){let h=hist(),u=new Set(h.map(x=>x.toLowerCase())),b=full.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,""),e;do{e=b+randDigits()+"@outlook.fr"}while(u.has(e.toLowerCase()));h.push(e);try{localStorage.setItem(KEY,JSON.stringify(h))}catch(x){}return e}
function pages(n,s){if(s===1)return[n];return Array.from({length:s},(_,i)=>n+"-"+(i+1))}
function generate(){let c=$("country").value,g=$("gender").value,f=$("format").value,s=+$("serial").value,q=Math.min(100,+$("qty").value||0),pass=$("password").value.trim(),doMail=$("outlook").value==="yes",doFb=$("fb").value==="yes";if(q<1)return alert("Enter valid quantity.");let first=DB[c][g],last=DB[c].last,max=f==="first"?first.length:first.length*last.length;q=Math.min(q,max);$("qty").value=q;generated=[];let used=new Set();while(generated.length<q){let a=pick(first),b=pick(last),full=a+" "+b,display=f==="first"?a:full;if(used.has(display))continue;used.add(display);generated.push({first:a,last:b,display,pageNames:pages(display,s),email:doMail?mail(full):"",password:pass,categories:doFb?threeCats():[]})}render()}
function render(){$("results").innerHTML="";$("count").textContent=generated.length+" base names generated";generated.forEach((x,i)=>{let d=document.createElement("div");d.className="card";let cats=x.categories.map(c=>`<span class="cat" data-cat="${c.replace(/"/g,"&quot;")}">${c}</span>`).join("");d.innerHTML=`<div class="hint">RESULT ${String(i+1).padStart(2,"0")}</div><div class="name">${x.pageNames.join("<br>")}</div>${x.email?`<div class="meta mailClick">📧 ${x.email}</div>`:""}${x.password?`<div class="meta pass passClick">🔐 ${x.password}</div>`:""}${x.categories.length?`<div class="hint">FACEBOOK CATEGORIES • TAP TO COPY</div><div class="cats">${cats}</div>`:""}<div class="btns"><button class="first">First</button><button class="last">Last</button><button class="mailb" ${x.email?"":"disabled"}>Mail</button><button class="passb" ${x.password?"":"disabled"}>Pass</button><button class="catsb" ${x.categories.length?"":"disabled"}>3 Cats</button><button class="pageb">Page Names</button></div>`;d.querySelector(".first").onclick=()=>copy(x.first);d.querySelector(".last").onclick=()=>copy(x.last);if(x.email){d.querySelector(".mailb").onclick=()=>copy(x.email);d.querySelector(".mailClick").onclick=()=>copy(x.email)}if(x.password){d.querySelector(".passb").onclick=()=>copy(x.password);d.querySelector(".passClick").onclick=()=>copy(x.password)}d.querySelectorAll(".cat").forEach(e=>e.onclick=()=>copy(e.dataset.cat));if(x.categories.length)d.querySelector(".catsb").onclick=()=>copy(x.categories.join("\n"));d.querySelector(".pageb").onclick=()=>copy(x.pageNames.join("\n"));$("results").appendChild(d)})}
async function copy(t){if(!t)return;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){let a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.focus();a.select();try{ok=document.execCommand("copy")}catch(e){}a.remove()}let z=$("toast");z.textContent=ok?"Copied ✓":"Copy failed";z.classList.add("on");setTimeout(()=>z.classList.remove("on"),900)}
function need(){if(!generated.length){alert("Generate first.");return false}return true}
function copyAllNames(){if(need())copy(generated.flatMap(x=>x.pageNames).join("\n"))}
function copyAllFirst(){if(need())copy(generated.map(x=>x.first).join("\n"))}
function copyAllLast(){if(need())copy(generated.map(x=>x.last).join("\n"))}
function copyAllMail(){if(!need())return;let a=generated.filter(x=>x.email).map(x=>x.email);a.length?copy(a.join("\n")):alert("Outlook is OFF.")}
function copyAllCats(){if(!need())return;let a=generated.filter(x=>x.categories.length).flatMap(x=>x.categories);a.length?copy(a.join("\n")):alert("Facebook categories are OFF.")}
function clearResults(){generated=[];$("count").textContent="No data generated";$("results").innerHTML='<div class="empty">Generate your first set ⚡</div>'}
</script></body></html>
